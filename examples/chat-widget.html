<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة ذكاء اصطناعي متدفقة — مثال جاهز</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .chat { width: 100%; max-width: 640px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
  header { background: #1a73e8; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; }
  select, button { cursor: pointer; }
  #model { border: none; border-radius: 6px; padding: 5px 8px; font-size: 13px; max-width: 150px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; font-size: 15px; }
  .user { align-self: flex-start; background: #e3f0fd; color: #174ea6; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-end; background: #f1f3f4; color: #202124; border-bottom-left-radius: 4px; }
  .err { align-self: center; background: #fdecea; color: #c5221f; font-size: 13px; padding: 6px 12px; border-radius: 8px; }
  /* صندوق التفكير المباشر */
  .think { align-self: flex-end; max-width: 85%; border: 1px dashed #c3c8cf; border-radius: 12px; padding: 8px 12px; font-size: 13px; color: #5f6368; }
  .think .head { font-weight: 600; color: #1a73e8; margin-bottom: 4px; }
  .think .head::before { content: "💭 "; }
  .think .trace { max-height: 80px; overflow: hidden; opacity: .85; }
  .think .trace.open { max-height: 300px; overflow-y: auto; opacity: 1; }
  .think details summary { cursor: pointer; user-select: none; font-size: 12px; color: #1a73e8; }
  .cursor { display: inline-block; width: 8px; background: #1a73e8; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .typing { align-self: flex-end; font-size: 13px; color: #5f6368; padding: 4px 10px; }
  .typing span { animation: bounce 1.2s infinite; display: inline-block; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 30% { transform: translateY(-4px); } }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e0e0e0; }
  input { flex: 1; border: 1px solid #dadce0; border-radius: 24px; padding: 10px 16px; font-size: 15px; outline: none; }
  input:focus { border-color: #1a73e8; }
  form button { background: #1a73e8; color: #fff; border: none; border-radius: 24px; padding: 10px 22px; font-size: 15px; }
  form button:disabled { background: #9ac0f5; cursor: wait; }
  .tools { display: flex; gap: 8px; padding: 0 12px 10px; }
  .tools button { font-size: 12px; border: 1px solid #dadce0; background: #fff; border-radius: 16px; padding: 4px 12px; color: #5f6368; }
</style>
</head>
<body>
<div class="chat">
  <header>
    <h1>🤖 دردشة متدفقة (يفكر + يكتب لحظياً)</h1>
    <select id="model">
      <option value="beam-free">beam-free ⭐</option>
      <option value="cat-jam-free">cat-jam-free</option>
      <option value="space-bunny-free">space-bunny-free</option>
      <option value="deepseek-v4.1-flash-free">deepseek-v4.1-flash</option>
      <option value="exo-free">exo-free</option>
    </select>
  </header>
  <div id="log"></div>
  <div class="tools">
    <button onclick="newChat()">🗑️ محادثة جديدة</button>
  </div>
  <form id="form">
    <input id="input" placeholder="اكتب رسالتك..." autocomplete="off" required>
    <button id="send">إرسال</button>
  </form>
</div>

<script>
const API = "https://superagent-2b61d5b9.base44.app/functions/opencodeChat";
const sessionKey = "chat-" + (localStorage.getItem("visitor") ?? (localStorage.setItem("visitor", Math.random().toString(36).slice(2)), localStorage.getItem("visitor")));

const log = document.getElementById("log");
const input = document.getElementById("input");
const send = document.getElementById("send");

// ===== الذاكرة المحلية (تعمل دائماً حتى لو كان تخزين السيرفر محجوباً) =====
function loadHistory() { try { return JSON.parse(localStorage.getItem("history-" + sessionKey)) || []; } catch { return []; } }
function saveHistory(h) { try { localStorage.setItem("history-" + sessionKey, JSON.stringify(h.slice(-40))); } catch {} }

function addMsg(text, cls) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// ===== استكمال تلقائي: لو انقطع الرد في منتصفه (finish_reason=length أو بلا done) نكمل من نقطة التوقف =====
async function askFull(prompt, continuationOf) {
  let result = await ask(continuationOf ? null : prompt, null, continuationOf);
  let guard = 0;
  while (result && result.truncated && guard < 4) {
    result = await ask(null, null, result);
    guard++;
  }
  return result;
}

// ===== الدردشة المتدفقة عبر SSE =====
// prompt = طلب جديد | continuationOf = {answer, session} للاستكمال بعد الانقطاع
async function ask(prompt, retryModel, continuationOf) {
  const history = loadHistory();
  const model = retryModel || document.getElementById("model").value;
  const userMsg = continuationOf
    ? { role: "user", content: "أكمل من حيث توقفت بالضبط. لا تكرر أي شيء، أكمل النص المقطوع مباشرة." }
    : { role: "user", content: prompt };
  // في وضع الاستكمال لا نعرض رسالة مستخدم جديدة — نكمل في نفس الفقاعة

  // مؤشر "يكتب" قبل أول توكِن
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "النموذج يستعد <span>·</span><span>·</span><span>·</span>";
  log.appendChild(typing); log.scrollTop = log.scrollHeight;

  // صندوق التفكير + فقاعة الرد (تُنشأ عند أول توكِن)
  let thinkBox = null, trace = null, bubble = null, answer = "";
  let reasoningText = "";
  let gotDone = false;

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        stream: true,                       // ← مفتاح البث اللحظي
        model,
        session: sessionKey,                // ذاكرة السيرفر إن كانت متاحة
        messages: continuationOf
          ? history.slice(-30).concat([
              { role: "user", content: continuationOf.lastUserPrompt || prompt || "" },
              { role: "assistant", content: continuationOf.answer },
              userMsg,
            ])
          : history.slice(-30).concat([{ role: "user", content: prompt }]), // ذاكرة محلية مضمونة
        // لا ترسل max_tokens هنا: الوضع الافتراضي "max power" يعطي النموذج سقفه الكامل
        // (beam-free = 131072 توكِن). حد صغير مثل 2000 يقصّ ردود توليد الكود الطويلة!
      }),
    });

    if (!res.ok || !res.body) {
      // 502: نموذج ميت → beam-free / 429: حد المعدل → انتظار وإعادة
      if (res.status === 502 && model !== "beam-free") { typing.remove(); return ask(prompt, "beam-free"); }
      if (res.status === 429) { await new Promise(r => setTimeout(r, 4000)); typing.remove(); return ask(prompt, "beam-free"); }
      throw new Error("HTTP " + res.status);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() ?? "";
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        let evt; try { evt = JSON.parse(line.slice(5)); } catch { continue; }

        if (evt.type === "reasoning") {
          // أول فكرة؟ أنشئ صندوق التفكير وارفع مؤشر "يستعد"
          if (!thinkBox) {
            typing.remove();
            thinkBox = document.createElement("div");
            thinkBox.className = "think";
            thinkBox.innerHTML = '<div class="head">يفكر الآن...</div><div class="trace"></div>';
            trace = thinkBox.querySelector(".trace");
            log.appendChild(thinkBox);
          }
          reasoningText += evt.text;
          trace.textContent = reasoningText.slice(-400);   // آخر 400 حرف فقط
          log.scrollTop = log.scrollHeight;
        }
        if (evt.type === "answer") {
          // أول توكِن من الرد: أخف التفكير إلى سطر قابل للفتح
          if (thinkBox) {
            thinkBox.querySelector(".head").textContent = "انتهى التفكير — اضغط للعرض";
            const d = document.createElement("details");
            d.appendChild(trace); trace.classList.add("open");
            const s = document.createElement("summary"); s.textContent = "💭 سلسلة التفكير";
            thinkBox.innerHTML = ""; thinkBox.appendChild(s); thinkBox.appendChild(d);
            thinkBox = null;
          }
          if (!bubble) {
            typing.remove();
            // في وضع الاستكمال نستمر في آخر فقاعة بدل فقاعة جديدة
            bubble = continuationOf ? (log.querySelector(".msg.bot:last-of-type") || addMsg("", "bot")) : addMsg("", "bot");
            if (continuationOf && bubble.textContent) answer = bubble.textContent; // لا تفقد النص السابق
          }
          answer += evt.text;
          bubble.textContent = answer;                     // النص يُكتب حرفياً أمام العين
          bubble.innerHTML += '<span class="cursor">&nbsp;</span>';
          bubble.textContent = answer; // keep plain text; cursor shown only between reads
          log.scrollTop = log.scrollHeight;
        }
        if (evt.type === "done") {
          gotDone = true;
          if (bubble) bubble.textContent = answer || evt.content || "";
          const finalText = answer || evt.content || "";
          const truncated = evt.finish_reason === "length"; // قُصّ عند حد التوكنات
          // حفظ الذاكرة المحلية
          const h = loadHistory();
          if (!continuationOf) h.push({ role: "user", content: prompt }, { role: "assistant", content: finalText });
          else {
            // دمج الاستكمال مع الرد السابق
            for (let i = h.length - 1; i >= 0; i--) if (h[i].role === "assistant") { h[i].content = finalText; break; }
          }
          saveHistory(h);
          return { answer: finalText, truncated, lastUserPrompt: prompt };
        }
        if (evt.type === "error") throw new Error(evt.error || "stream_error");
      }
    }
    if (!bubble && !answer) throw new Error("empty_stream");
    // انتهى البث بدون done (انقطاع شبكة/منصة): لو وصل نص جزئي نستكمله
    if (!gotDone && answer && bubble) return { answer, truncated: true, lastUserPrompt: prompt };
  } catch (e) {
    typing.remove();
    addMsg("⚠️ " + e.message, "err");
  }
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const prompt = input.value.trim();
  if (!prompt || send.disabled) return;
  input.value = "";
  addMsg(prompt, "user");
  send.disabled = true;
  await askFull(prompt);
  send.disabled = false;
  input.focus();
});

function newChat() {
  localStorage.removeItem("history-" + sessionKey);
  fetch(API.replace("opencodeChat", "opencodeSessions"), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "clear", session: sessionKey }),
  }).catch(() => {}); // مسح السيرفر اختياري (503 يعني التخزين محجوب أصلاً)
  log.innerHTML = "";
  addMsg("بدأنا محادثة جديدة 🌟", "bot");
}

// استرجاع الذاكرة المحلية عند فتح الصفحة
addEventListener("load", () => {
  const h = loadHistory().slice(-10);
  for (const m of h) addMsg(m.content, m.role === "user" ? "user" : "bot");
  if (h.length) addMsg("— استرجعنا آخر المحادثة من ذاكرتك المحلية —", "bot");
});
</script>
</body>
</html>
