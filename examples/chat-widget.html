<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة ذكاء اصطناعي مجانية — مثال جاهز</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .chat { width: 100%; max-width: 640px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
  header { background: #1a73e8; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; }
  select, button { cursor: pointer; }
  #model { border: none; border-radius: 6px; padding: 5px 8px; font-size: 13px; max-width: 150px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; font-size: 15px; }
  .user { align-self: flex-start; background: #e3f0fd; color: #174ea6; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-end; background: #f1f3f4; color: #202124; border-bottom-left-radius: 4px; }
  .err { align-self: center; background: #fdecea; color: #c5221f; font-size: 13px; padding: 6px 12px; border-radius: 8px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e0e0e0; }
  input { flex: 1; border: 1px solid #dadce0; border-radius: 24px; padding: 10px 16px; font-size: 15px; outline: none; }
  input:focus { border-color: #1a73e8; }
  form button { background: #1a73e8; color: #fff; border: none; border-radius: 24px; padding: 10px 22px; font-size: 15px; }
  form button:disabled { background: #9ac0f5; cursor: wait; }
  .tools { display: flex; gap: 8px; padding: 0 12px 10px; }
  .tools button { font-size: 12px; border: 1px solid #dadce0; background: #fff; border-radius: 16px; padding: 4px 12px; color: #5f6368; }
</style>
</head>
<body>
<div class="chat">
  <header>
    <h1>🤖 دردشة ذكاء اصطناعي (مجاني)</h1>
    <select id="model">
      <option value="beam-free">beam-free ⭐</option>
      <option value="cat-jam-free">cat-jam-free</option>
      <option value="space-bunny-free">space-bunny-free</option>
      <option value="deepseek-v4.1-flash-free">deepseek-v4.1-flash</option>
      <option value="exo-free">exo-free</option>
      <option value="nemotron-3.5-super-vl-free">nemotron (صور)</option>
    </select>
  </header>
  <div id="log"></div>
  <div class="tools">
    <button onclick="newChat()">🗑️ محادثة جديدة</button>
    <button onclick="loadHistory()">📜 استرجاع السجل</button>
  </div>
  <form id="form">
    <input id="input" placeholder="اكتب رسالتك..." autocomplete="off" required>
    <button id="send">إرسال</button>
  </form>
</div>

<script>
const API     = "https://superagent-2b61d5b9.base44.app/functions/opencodeChat";
const SESSIONS= "https://superagent-2b61d5b9.base44.app/functions/opencodeSessions";

// مفتاح الجلسة: ثابت للمستخدم الحالي (عدّله لو أردت جلسة لكل زائر)
const sessionKey = "demo-" + (localStorage.getItem("visitor") ?? (localStorage.setItem("visitor", Math.random().toString(36).slice(2)), localStorage.getItem("visitor")));

const log   = document.getElementById("log");
const input = document.getElementById("input");
const send  = document.getElementById("send");

function addMsg(text, cls) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;
  input.value = "";
  addMsg(prompt, "user");

  const loading = addMsg("... يكتب", "bot");
  send.disabled = true;
  try {
    let res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, session: sessionKey, model: document.getElementById("model").value })
    });
    let data = await res.json();

    // معالجة الأخطاء: نموذج معطل → beam-free / حد معدل → انتظر
    if (res.status === 502) {
      res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, session: sessionKey, model: "beam-free" }) });
      data = await res.json();
    } else if (res.status === 429) {
      await new Promise(r => setTimeout(r, 4000));
      res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, session: sessionKey, model: "beam-free" }) });
      data = await res.json();
    }

    loading.textContent = data.content ?? "خطأ: " + (data.error ?? "غير معروف");
  } catch (err) {
    loading.textContent = "تعذر الاتصال بالسيرفر: " + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
});

async function newChat() {
  await fetch(SESSIONS, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "clear", session: sessionKey }) });
  log.innerHTML = "";
  addMsg("بدأنا محادثة جديدة 🌟", "bot");
}

async function loadHistory() {
  const r = await fetch(SESSIONS, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "get", session: sessionKey }) });
  const d = await r.json();
  if (!d.history?.length) { addMsg("لا يوجد سجل محفوظ لهذه الجلسة بعد.", "err"); return; }
  log.innerHTML = "";
  for (const m of d.history) addMsg(m.content, m.role === "user" ? "user" : "bot");
}
</script>
</body>
</html>
